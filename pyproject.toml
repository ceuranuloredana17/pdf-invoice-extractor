[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-extractor"
version = "1.0.0"
description = "Extract structured data (numbers, dates, parties, totals, line items) from PDF invoices and validate it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
dev = [
    "invoice-extractor[web]",
    "httpx>=0.27",
    "pytest>=8",
    "pytest-cov>=5",
    "reportlab>=4",
    "ruff>=0.5",
]

[project.scripts]
invoice-extractor = "invoice_extractor.cli:main"
invoice-extractor-web = "invoice_extractor.web.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"invoice_extractor.web" = ["static/*", "static/samples/*.pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
